{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div style="max-width: 360px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" required
               style="width: 100%; padding: 0.6rem; margin: 0.4rem 0 1rem; border: 1px solid #ccc; border-radius: 4px;">
        <label>Password</label>
        <input type="password" name="password" required
               style="width: 100%; padding: 0.6rem; margin: 0.4rem 0 1rem; border: 1px solid #ccc; border-radius: 4px;">
        <button type="submit"
                style="width: 100%; padding: 0.7rem; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;">
            Login
        </button>
    </form>
    <p class="auth-footer">
        Don't have an account? <a href="{% url 'register' %}">Register</a>
    </p>
</div>
{% endblock %}
